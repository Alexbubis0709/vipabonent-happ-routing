name: Build Happ routing

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * 1"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "custom/**"

permissions:
  contents: write

concurrency:
  group: happ-routing-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Happ profile
        run: python3 scripts/build_routing.py

      - name: Build QR code
        run: |
          python3 -m pip install --quiet "qrcode[pil]"
          python3 - <<'PY'
          import qrcode
          from pathlib import Path
          value = Path("HAPP/ROUTING.ONADD.DEEPLINK").read_text(encoding="utf-8").strip()
          qrcode.make(value).save("HAPP/ROUTING.QR.png")
          PY

      - name: Commit refreshed files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HAPP
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "build: refresh Happ routing"
          git push
